name: Benchmark Submission Validator

on:
  issues:
    types: [opened, edited]

jobs:
  validate-benchmark:
    if: contains(github.event.issue.labels.*.name, 'benchmark') || startsWith(github.event.issue.title, 'Benchmark:')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Validate Benchmark JSON Payload
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body || '';
            
            // Extract JSON code block or raw JSON object
            let jsonText = null;
            const match = issueBody.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
            if (match) {
              jsonText = match[1];
            } else {
              const braceMatch = issueBody.match(/\{[\s\S]*"results"[\s\S]*\}/);
              if (braceMatch) {
                jsonText = braceMatch[0];
              }
            }

            if (!jsonText) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: "⚠️ **Benchmark Validator Notice**: Could not locate a valid JSON benchmark payload in the issue description. Please ensure you paste the full JSON output generated by `agent-otel-bench --json`."
              });
              return;
            }

            try {
              const data = JSON.parse(jsonText.trim());
              const meta = data.metadata || {};
              const res = data.results || {};
              const pipe = res.pipe || {};
              const parse = res.parse || {};
              const spawn = res.spawn || {};
              const verdict = res.verdict || {};

              const pipeP50 = pipe.p50_us ?? 0;
              const pipeP99 = pipe.p99_us ?? 0;
              const spawnP50Ms = (spawn.p50_us ? spawn.p50_us / 1000 : 0).toFixed(2);
              const spawnP99Ms = (spawn.p99_us ? spawn.p99_us / 1000 : 0).toFixed(2);
              const throughput = parse.spans_per_sec ? Math.round(parse.spans_per_sec).toLocaleString() : 'N/A';

              const pipePass = pipeP99 <= (data.sla_target_us || 3000);
              const spawnPass = (spawn.p99_us || 0) <= 10000;
              const allPass = pipePass && spawnPass;

              const commentBody = `### 🤖 Automated Benchmark Validation Result

              Thank you for contributing your benchmark data!

              | Measurement Stage | Value | SLA Target | Status |
              |---|---:|---:|:---:|
              | **Named Pipe RTT (p50)** | \`${pipeP50} µs\` | < 3,000 µs | ${pipeP50 < 3000 ? '✅ PASS' : '❌ FAIL'} |
              | **Named Pipe RTT (p99)** | \`${pipeP99} µs\` | < 3,000 µs | ${pipePass ? '✅ PASS' : '❌ FAIL'} |
              | **Process Spawn (p50)** | \`${spawnP50Ms} ms\` | < 10.0 ms | ${spawnP50Ms < 10 ? '✅ PASS' : '❌ FAIL'} |
              | **Process Spawn (p99)** | \`${spawnP99Ms} ms\` | < 10.0 ms | ${spawnPass ? '✅ PASS' : '❌ FAIL'} |
              | **OTLP Span Throughput** | \`${throughput} spans/sec\` | > 50,000 | ✅ PASS |

              - **CPU**: ${meta.cpu_brand || 'Unknown CPU'} (${meta.cpu_cores || '?'} logical cores)
              - **OS**: ${meta.os_name || 'Unknown'} ${meta.os_version || ''} (Build ${meta.os_build || '?'}, ${meta.os_arch || 'x86_64'})
              - **RAM**: ${meta.ram_gb ? meta.ram_gb + ' GB' : 'N/A'}
              - **Rust Toolchain**: \`${meta.rustc_version || 'N/A'}\`
              - **Overall Verdict**: ${allPass ? '✅ **VERIFIED COMPLIANT**' : '⚠️ **SLA EXCEEDED**'}

              ${allPass ? '🎉 This submission has been marked as **verified** and will be integrated into [`docs/COMMUNITY_BENCHMARKS.md`](https://github.com/smota/agent-otel-bridge/blob/main/docs/COMMUNITY_BENCHMARKS.md).' : 'Notice: One or more measurements exceeded SLA thresholds. Please ensure the test is run on an idle system.'}`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: commentBody
              });

              if (allPass) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels: ['benchmark-verified']
                });
              }
            } catch (err) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ **Benchmark Validator Notice**: Failed to parse JSON benchmark payload: \`${err.message}\`.`
              });
            }
