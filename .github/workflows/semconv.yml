name: Semconv

on:
  pull_request:
  push:
    branches: [main]

jobs:
  registry:
    name: Registry snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Weaver 0.28.0
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/weaver.tar.xz \
            https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-unknown-linux-gnu.tar.xz
          tar -xJf /tmp/weaver.tar.xz -C /tmp
          sudo install -m 0755 /tmp/weaver-x86_64-unknown-linux-gnu/weaver /usr/local/bin/weaver

      - name: Check registry with Weaver
        run: weaver registry check -r semconv

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch agent-otel-core dependencies
        run: cargo fetch -p agent-otel-core

      - name: Registry lists attribute constants
        run: cargo test -p agent-otel-core --offline registry_lists_attribute_constants
