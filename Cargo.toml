[workspace]
members = [
    "crates/agent-otel-core",
    "crates/agent-otel-ipc",
    "crates/agent-otel-client",
    "crates/agent-otel-daemon",
    "crates/agent-otel-cli",
    "crates/agent-otel-bench",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"
authors = ["Samuel Mota <samuel@movetheneedle.info>"]
license = "Apache-2.0"
repository = "https://github.com/smota/agent-otel-bridge"
homepage = "https://github.com/smota/agent-otel-bridge"
documentation = "https://docs.rs/agent-otel-bridge"
readme = "README.md"
description = "High-Performance OpenTelemetry Bridge for AI CLI Agent Harnesses"

[workspace.dependencies]
agent-otel-core = { version = "0.5.1", path = "crates/agent-otel-core" }
agent-otel-ipc = { version = "0.5.1", path = "crates/agent-otel-ipc", default-features = false }
agent-otel-client = { version = "0.5.1", path = "crates/agent-otel-client" }
agent-otel-daemon = { version = "0.5.1", path = "crates/agent-otel-daemon" }
agent-otel-bridge = { version = "0.5.1", path = "crates/agent-otel-cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
prost-types = "0.14"
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
tokio = { version = "1.43", default-features = false }
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemInformation"
] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.release.package.agent-otel-client]
opt-level = "s"

[profile.bench]
inherits = "release"
debug = true
strip = false
