[package]
name = "agent-otel-fleet-smoke"
version.workspace = true
edition.workspace = true
publish = false
description = "Development-only synthetic fleet smoke laboratory"

[dependencies]
command-group = "5.0.1"
reqwest = { workspace = true, features = ["blocking", "json"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { version = "0.3", features = ["formatting"] }
ctrlc = "3.5"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }
agent-otel-core = { path = "../../crates/agent-otel-core" }
agent-otel-daemon = { path = "../../crates/agent-otel-daemon" }
agent-otel-ipc = { path = "../../crates/agent-otel-ipc" }
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }
