# Local otelcol-contrib config for one developer workstation.
# Point the daemon at this collector: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# and OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf. The daemon already exports
# OTLP/HTTP protobuf. Do not add batch, retry, or a vendor exporter there.
#
# Auth, sampling, and vendor export belong in this file.
# This local file does not tail-sample. team.yaml does, and it does not key
# off span duration.
#
# Hook spans currently have equal start and end. They are not measured tool
# durations. Do not treat durationNano as tool latency, and do not add a
# duration histogram here.

receivers:
  otlp:
    protocols:
      http:
        endpoint: localhost:4318

processors:
  # System attributes fill gaps only. Existing resource attributes stay.
  resourcedetection:
    detectors: [system]
    override: false
  # Redact the operator address. update does not create the key and does not
  # drop the span or any other attribute.
  attributes/redact_user_email:
    actions:
      - key: user.email
        action: update
        value: "REDACTED"
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 512
    timeout: 1s

exporters:
  otlphttp:
    # Base URL only. The collector appends /v1/traces and /v1/metrics.
    # Example:
    #   export OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp.example.com
    #   export OTEL_EXPORTER_OTLP_AUTH_HEADER='Bearer <token>'
    # Do not hard-code a token in this file.
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_EXPORTER_OTLP_AUTH_HEADER}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes/redact_user_email, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp]
