[package]
name = "agent-otel-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified CLI for agent-otel-bridge: hook, daemon, doctor, emit-quota"

[[bin]]
name = "agent-otel-bridge"
path = "src/main.rs"

[dependencies]
agent-otel-core = { path = "../agent-otel-core" }
agent-otel-ipc = { path = "../agent-otel-ipc" }
agent-otel-daemon = { path = "../agent-otel-daemon" }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
