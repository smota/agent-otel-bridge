[package]
name = "agent-otel-ipc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "High-performance Win32 named pipe IPC for agent-otel-bridge"

[features]
default = ["client-sync", "server-async"]
client-sync = []
server-async = ["tokio", "tokio-util"]

[dependencies]
agent-otel-core = { workspace = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util", "sync", "macros", "rt", "time"] }
tokio-util = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
